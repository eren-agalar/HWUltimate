# Publishing a release: bump <Version> in Directory.Build.props, commit, then push a tag "v<version>" (e.g. v0.3.1).
# This workflow builds, tests, packages HWUltimate-v<version>-win-x64.zip with its .sha256, and creates the GitHub release.
# Installed copies of HWUltimate find the new release and offer to download and install it.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check version matches tag
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match <Version>$version</Version>" }
          "VERSION=$version" >> $env:GITHUB_ENV
      - run: dotnet build HWUltimate.sln -c Release
      - run: dotnet test --project tests/HWUltimate.Tests -c Release --no-build
      - run: dotnet publish src/HWUltimate.App -c Release -r win-x64 --self-contained false -o publish
      - name: Package
        shell: pwsh
        run: |
          Remove-Item publish\*.pdb -ErrorAction SilentlyContinue
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md publish\
          $zip = "HWUltimate-v$env:VERSION-win-x64.zip"
          Compress-Archive -Path publish\* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File "$zip.sha256" -Encoding ascii -NoNewline
          "ZIP=$zip" >> $env:GITHUB_ENV
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = "docs/releases/v$env:VERSION.md"
          if (Test-Path $notes) { gh release create "${{ github.ref_name }}" $env:ZIP "$env:ZIP.sha256" --title "HWUltimate v$env:VERSION" --notes-file $notes }
          else { gh release create "${{ github.ref_name }}" $env:ZIP "$env:ZIP.sha256" --title "HWUltimate v$env:VERSION" --generate-notes }
