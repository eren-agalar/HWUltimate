# Publishing a release: set <Version> in Directory.Build.props (e.g. 0.3.1), optionally add docs/releases/v0.3.1.md,
# and push to main. When no release "v<version>" exists yet, this workflow builds and tests on Windows, packages
# HWUltimate-v<version>-win-x64.zip with its .sha256, and creates the tag and the GitHub release.
# Installed copies of HWUltimate then notify their users and can update from inside the app.
name: release
on:
  push:
    branches: [main]
    paths: ['Directory.Build.props', 'docs/releases/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = ($props.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if (-not $version) { throw "No <Version> in Directory.Build.props" }
          "VERSION=$version" >> $env:GITHUB_ENV
          gh release view "v$version" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "EXISTS=true" >> $env:GITHUB_ENV; Write-Host "Release v$version already exists; nothing to do." }
          else { "EXISTS=false" >> $env:GITHUB_ENV }
          exit 0
      - uses: actions/setup-dotnet@v4
        if: env.EXISTS == 'false'
        with:
          dotnet-version: 10.0.x
      - if: env.EXISTS == 'false'
        run: dotnet build HWUltimate.sln -c Release
      - if: env.EXISTS == 'false'
        run: dotnet test --project tests/HWUltimate.Tests -c Release --no-build
      - if: env.EXISTS == 'false'
        run: dotnet publish src/HWUltimate.App -c Release -r win-x64 --self-contained false -o publish
      - name: Package
        if: env.EXISTS == 'false'
        shell: pwsh
        run: |
          Remove-Item publish\*.pdb -ErrorAction SilentlyContinue
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md publish\
          $zip = "HWUltimate-v$env:VERSION-win-x64.zip"
          Compress-Archive -Path publish\* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File "$zip.sha256" -Encoding ascii -NoNewline
          "ZIP=$zip" >> $env:GITHUB_ENV
      - name: Create tag and release
        if: env.EXISTS == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          $notes = "docs/releases/$tag.md"
          $args = @($tag, $env:ZIP, "$env:ZIP.sha256", "--repo", "${{ github.repository }}", "--target", "${{ github.sha }}", "--title", "HWUltimate $env:VERSION", "--latest")
          if (Test-Path $notes) { $args += @("--notes-file", $notes) } else { $args += "--generate-notes" }
          gh release create @args
