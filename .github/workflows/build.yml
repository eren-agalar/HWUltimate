name: build
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build NovaHardware.sln -c Release
      - run: dotnet test --project tests/NovaHardware.Tests -c Release --no-build
      - run: dotnet publish src/NovaHardware.App -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: NovaHardware-win-x64
          path: publish
